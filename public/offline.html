<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#145C25" />
  <title>Tydigo — You're Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #0A2F14 0%, #145C25 50%, #0D3B1A 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 16px;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #ffffff;
      color: #145C25;
    }
    .btn-primary:hover {
      background: #f0fdf4;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.12);
      color: #ffffff;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }
    .features {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      opacity: 0.7;
    }
    .feature-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you don't have an internet connection right now.
      Tydigo needs a connection to schedule pickups and sync your data.
    </p>
    <div class="actions">
      <button class="btn-primary" onclick="location.reload()">
        Try Again
      </button>
      <button class="btn-secondary" onclick="window.history.back()">
        Go Back
      </button>
    </div>
    <div class="features">
      <div class="feature">
        <span class="feature-dot"></span> Saved addresses
      </div>
      <div class="feature">
        <span class="feature-dot"></span> EcoPoints balance
      </div>
      <div class="feature">
        <span class="feature-dot"></span> Pickup history
      </div>
    </div>
  </div>
</body>
</html>
